[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rql-repro"
version = "0.1.0"
description = "Companion reproducibility package for RQL (offline parser/planner/adapters)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vijay Kumar" }]
dependencies = [
  "jsonschema==4.26.0",
  "numpy==2.2.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["code"]
include = ["rql_parser*", "rql_planner*", "rql_adapters*"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
